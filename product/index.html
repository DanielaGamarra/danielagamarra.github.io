<body>
<!-- top bar -->
<header class="bar">
  <a class="brand" href="#cover" data-go="cover"><span class="brand-d">DAGA</span><span class="brand-s">'s digibook</span></a>
  <div class="bar-tools">
    <button class="tool" id="btn-theme" title="Paper (light) version" aria-label="Switch light or dark">☀</button>
    <button class="tool" id="btn-doodle" aria-pressed="false" title="Doodle on the digibook">✎ <span>doodle</span></button>
    <button class="tool" id="btn-fit" title="See every page">⌖ <span>all pages</span></button>
    <button class="tool tool-cv" id="btn-cv" title="Read it as a CV">≡ <span>CV mode</span></button>
  </div>
</header>

<!-- sketchbook index tabs -->
<nav class="tabs" id="tabs" aria-label="Digibook pages"></nav>

<!-- doodle palette -->
<div class="palette" id="palette" hidden>
  <button data-ink="ink" class="on" aria-label="Ink pen"><i style="background:var(--ink)"></i></button>
  <button data-ink="blue" aria-label="Blue pen"><i style="background:var(--blue)"></i></button>
  <button data-ink="red" aria-label="Red pen"><i style="background:var(--red)"></i></button>
  <button data-ink="lime" aria-label="Highlighter"><i style="background:var(--lime)"></i></button>
  <button data-act="undo" aria-label="Undo">↶</button>
  <button data-act="clear" aria-label="Clear doodles">✕</button>
  <button data-act="save" class="save" hidden>⤓ save for everyone</button>
  <span class="palette-hint">click + drag to draw anywhere · stays on this device</span>
</div>

<!-- the desk (infinite canvas) -->
<main class="desk" id="desk">
  <div class="world" id="world">
    <svg class="wlayer" id="sketch-bg" aria-hidden="true"></svg>
    <svg class="wlayer" id="shared-ink" aria-hidden="true"></svg>
    <svg class="ink-layer" id="ink-layer" aria-hidden="true"></svg>
    <svg class="wlayer" id="trail" aria-hidden="true"></svg>
  </div>
</main>

<div class="hud" id="hud" aria-hidden="true"></div>
<div class="hint" id="hint">drag to move · scroll to pan · pinch or ⌘ + scroll to zoom</div>

<!-- project page (detail) -->
<div class="sheet-wrap" id="sheet-wrap" hidden>
  <article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></article>
</div>

<!-- CV mode -->
<section class="cv" id="cv" hidden aria-label="Curriculum vitae"></section>
